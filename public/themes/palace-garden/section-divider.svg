<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 30" width="300" height="30" fill="none">
  <defs>
    <linearGradient id="pgGoldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C5A059" stop-opacity="0" />
      <stop offset="25%" stop-color="#C5A059" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#D4AF37" stop-opacity="1" />
      <stop offset="75%" stop-color="#C5A059" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#C5A059" stop-opacity="0" />
    </linearGradient>
  </defs>
  <!-- Fine horizontal gradient lines -->
  <line x1="20" y1="15" x2="125" y2="15" stroke="url(#pgGoldGrad)" stroke-width="1.2" />
  <line x1="175" y1="15" x2="280" y2="15" stroke="url(#pgGoldGrad)" stroke-width="1.2" />
  
  <!-- Left Scroll Flourish -->
  <path d="M125 15 C132 15, 136 11, 140 15" stroke="#C5A059" stroke-width="1.2" stroke-linecap="round" />
  <!-- Right Scroll Flourish -->
  <path d="M175 15 C168 15, 164 11, 160 15" stroke="#C5A059" stroke-width="1.2" stroke-linecap="round" />

  <!-- Center Diamond Floral Star -->
  <g transform="translate(150, 15)">
    <circle cx="0" cy="0" r="4" fill="#C5A059" fill-opacity="0.3" stroke="#C5A059" stroke-width="1" />
    <!-- 4 Petals -->
    <path d="M0 -9 C1 -5, 1 -5, 0 -3 C-1 -5, -1 -5, 0 -9" fill="#C5A059" />
    <path d="M0 9 C1 5, 1 5, 0 3 C-1 5, -1 5, 0 9" fill="#C5A059" />
    <path d="M-9 0 C-5 1, -5 1, -3 0 C-5 -1, -5 -1, -9 0" fill="#C5A059" />
    <path d="M9 0 C5 1, 5 1, 3 0 C5 -1, 5 -1, 9 0" fill="#C5A059" />
    <circle cx="0" cy="0" r="1.5" fill="#FAF6EE" />
  </g>
</svg>
